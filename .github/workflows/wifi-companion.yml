name: Wi-Fi Companion CI

on:
  push:
    branches: [main, feature/wifi-companion-remote]
    paths:
      - 'wifi-companion/**'
      - '.github/workflows/wifi-companion.yml'
  pull_request:
    paths:
      - 'wifi-companion/**'
      - '.github/workflows/wifi-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate desktop companion protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wifi-companion/requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wifi-companion/requirements.txt
          python -m pip install pip-audit
      - name: Compile and import companion modules
        run: |
          python -m py_compile wifi-companion/host.py wifi-companion/protocol.py
          cd wifi-companion
          python -c "import cryptography, qrcode, zeroconf, host, protocol; print('Companion imports OK')"
          python host.py --help
      - name: Audit Python dependencies
        run: pip-audit -r wifi-companion/requirements.txt
      - name: Run protocol unit tests
        working-directory: wifi-companion
        run: python -m unittest -v test_protocol.py
